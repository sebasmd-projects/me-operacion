<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertir audio a MP3 | ME Operación</title>
  <!-- Librerías de CDN: versiones y URLs en assets/base/dependencias.js (Bootstrap, iconos y fuentes siempre) -->
  <script src="../assets/base/dependencias.js" data-me-deps="jszip lamejs"></script>
  <link href="../assets/base/me-ui.css" rel="stylesheet">
  <link href="../assets/herramientas/audio-mp3/audio-mp3.css" rel="stylesheet">
</head>
<body data-me-herramienta="audio-mp3">
  <main class="container-fluid py-3">
    <section class="row g-3 mb-3" aria-label="Resumen">
      <div class="col-6 col-xl-3"><div class="card h-100"><div class="card-body"><div class="text-body-secondary small">Archivos</div><div class="fs-3 fw-semibold" id="audio-total">0</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="card h-100"><div class="card-body"><div class="text-body-secondary small">Pendientes</div><div class="fs-3 fw-semibold text-warning" id="audio-pendientes">0</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="card h-100"><div class="card-body"><div class="text-body-secondary small">Convertidos</div><div class="fs-3 fw-semibold text-success" id="audio-listos">0</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="card h-100"><div class="card-body"><div class="text-body-secondary small">Con error</div><div class="fs-3 fw-semibold text-danger" id="audio-errores">0</div></div></div></div>
    </section>

    <section class="me-trabajo">
      <div class="me-trabajo-lateral">
        <section data-me-paso="1" data-me-titulo="Seleccionar audios" data-me-abierto="siempre">
          <div id="audio-drop" data-me-dropzone aria-controls="audio-input">
            <input id="audio-input" type="file" multiple
              accept="audio/*,.ogg,.oga,.opus,.m4a,.aac,.wav,.flac,.mp3,.webm,.mp4">
          </div>
          <div class="me-hint">Inicialmente optimizado para OGG y M4A.</div>
        </section>

        <section data-me-paso="2" data-me-titulo="Convertir" data-me-abierto="siempre">
          <label for="audio-bitrate" class="form-label">Calidad MP3</label>
          <select id="audio-bitrate" class="form-select mb-3">
            <option value="96">96 kbps — voz / menor tamaño</option>
            <option value="128" selected>128 kbps — recomendado</option>
            <option value="192">192 kbps — alta calidad</option>
            <option value="256">256 kbps — máxima calidad</option>
          </select>
          <div class="d-grid gap-2">
            <button id="audio-convertir" class="btn btn-primary" type="button" disabled>
              <i class="bi bi-arrow-repeat me-1"></i> Convertir pendientes
            </button>
            <button id="audio-descargar-todo" class="btn btn-success" type="button" disabled>
              <i class="bi bi-download me-1"></i> Descargar resultados
            </button>
            <button id="audio-limpiar" class="btn btn-outline-secondary" type="button" disabled>
              <i class="bi bi-trash3 me-1"></i> Limpiar lista
            </button>
          </div>
          <p class="small text-body-secondary mt-3 mb-0">
            El proceso ocurre en este equipo: los audios no se cargan a ningún servidor.
          </p>
        </section>

        <section data-me-paso="3" data-me-titulo="Actividad" data-me-abierto="nunca">
          <div data-me-log aria-live="polite"></div>
        </section>
      </div>

      <div class="me-trabajo-datos">
        <div class="card h-100">
          <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <span class="fw-semibold"><i class="bi bi-list-check me-2"></i>Archivos</span>
            <span class="badge text-bg-secondary" id="audio-estado-general">Sin archivos</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th class="text-end">Acciones</th>
                  <th>Origen</th>
                  <th>Estado</th>
                  <th>Resultado</th>

                </tr>
              </thead>
              <tbody id="audio-lista">
                <tr id="audio-vacio"><td colspan="4" class="text-center text-body-secondary py-5">Selecciona audios para comenzar.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/base/catalogo.js"></script>
  <script src="../assets/base/me-ui.js"></script>
  <script src="../assets/herramientas/audio-mp3/audio-mp3.js"></script>
</body>
</html>
