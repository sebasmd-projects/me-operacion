<!-- hlr_hss.html · v2.6
     ---------------------------------------------------------------------
     Este archivo es SOLO marcado + el interruptor de pestañas. Nada de
     reglas de negocio vive aquí:

       assets/base/me-ui.css / me-ui.js       marco visual, sesión, registro,
                                          tablas, importación y exportación
       assets/herramientas/hlr-hss/hlr-hss.css  estilos de la herramienta
       assets/herramientas/hlr-hss/tigo.js      motor "Tigo"  (HLR/HSS Tigo)
       assets/herramientas/hlr-hss/claro.js     motor "Claro" (consulta QDN y
                                          operaciones sobre la línea: bloqueo,
                                          desbloqueo, conciliación... escriben
                                          en producción)
       assets/herramientas/hlr-hss/ambos.js     motor "Ambos" (cruce Claro/Tigo)
       assets/herramientas/hlr-hss/hlr-hss.js   interruptor de pestañas: monta/
                                          desmonta el <template> de la pestaña
                                          activa y llama a MotorX.iniciar()

     Por qué un <template> por pestaña y no las tres montadas a la vez: los
     tres motores comparten (por diseño, ya desde antes de esta fusión) los
     mismos ids — #tablaResultados, #inputLineas, #btnConsultar,
     #modalDetalle, #logConexion... Tenerlos montados los tres a la vez
     duplicaría esos ids en el documento y solo el primero respondería. Por
     eso solo la pestaña activa vive en el DOM; cambiar de pestaña desmonta
     la anterior por completo antes de montar la siguiente.

     Tres pestañas (Tigo, Claro, Ambos) en una sola herramienta. Ver doc/hlr-hss/README.md.
     --------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Versionado: Major.Minor.Patch · fix/documentación incrementa Patch -->
    <title>HLR/HSS · Claro y Tigo</title>

    <!-- Librerías de CDN: versiones y URLs en assets/base/dependencias.js (Bootstrap, iconos y fuentes siempre) -->
    <script src="../assets/base/dependencias.js" data-me-deps="datatables xlsx"></script>
    <link rel="stylesheet" href="../assets/base/me-ui.css">
    <link rel="stylesheet" href="../assets/herramientas/hlr-hss/hlr-hss.css">

<body class="me-body" data-me-herramienta="hlr-hss">

            <i class="bi bi-reception-4"></i>Tigo
        </button>
        <button type="button" class="hlr-tab" data-tab="claro" role="tab" aria-selected="false">
            <i class="bi bi-reception-4"></i>Claro

            <i class="bi bi-search"></i>¿En qué HLR está? (ambos)
        </button>
    </div>

    <div id="panelMontado"></div>

    <!-- ============================================================
         Cada <template> es el marcado ORIGINAL de esa herramienta,
         íntegro (KPIs + pasos + tabla + modal). Un <template> no forma
         parte del DOM activo -no ejecuta scripts, no aplica ids-, así
         que los tres pueden convivir en el archivo sin chocar entre sí;
         el choque solo pasaría si más de uno estuviera CLONADO dentro
         de #panelMontado al mismo tiempo, y eso es justo lo que
         hlr-hss.js evita.
         ============================================================ -->

                <div class="n" id="kpiActivas">0</div>
                <div class="lbl">Activas<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi neutro kpi-click" data-fdim="proceso" data-fval="SIN_PERFIL">
                <div class="n" id="kpiSinPerfil">0</div>
                <div class="lbl">Sin perfil<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi warn kpi-click" data-fdim="proceso" data-fval="RESIDUO_TIGO">
                <div class="n" id="kpiResiduoTigo">0</div>

            </div>

                    <button class="btn btn-sm btn-link px-0" type="button" data-bs-toggle="collapse"

                    <div class="row g-2 mt-1">
                        <div class="col-6">
                            <label class="me-lbl" for="selHoja">Hoja</label>

                                <option value="">— carga un archivo —</option>
                            </select>
                        </div>
                        <div class="col-6">

                            </select>
                        </div>
                        <div class="col-12">

                        </div>

            <!-- ================= COLUMNA DERECHA: filtros + tabla ================= -->

                            <ul class="dropdown-menu dropdown-menu-end p-2" id="menuColumnas"></ul>

                            <button class="btn btn-sm btn-me-line" id="btnCSV"><i class="bi bi-filetype-csv"></i>
                                CSV</button>
                            <button class="btn btn-sm btn-me-line" id="btnXLSX"><i class="bi bi-file-earmark-excel"></i>
                                Excel</button>
                            <button class="btn btn-sm btn-me-line" id="btnJSON"><i class="bi bi-filetype-json"></i>
                                JSON</button>
                        </div>
                    </div>
                </div>

                <div class="me-tabla-panel">
                    <table id="tablaResultados" class="table table-striped table-hover align-middle w-100">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                    <div class="me-hint p-2" id="msgVacio">
                        Escribe uno o varios MSISDN (o carga un Excel/CSV) y presiona <strong>Consultar</strong>.
                    </div>

            </div>
        </div>

        <!-- ============ MODAL DETALLE ============ -->
        <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <div>
                            <h5 class="modal-title mb-0">Línea <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdMsisdn"
                                    title="Copiar línea" aria-label="Copiar línea">⧉</button><span id="mdMsisdn" class="me-mono"></span></span>
                            </h5>
                            <div class="mt-1" style="font-size:.8rem;opacity:.85">
                                IMSI <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdImsi"
                                    title="Copiar IMSI" aria-label="Copiar IMSI">⧉</button><span id="mdImsi" class="me-mono">—</span></span>
                                <span class="ms-3">IMEI <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdImei"
                                    title="Copiar IMEI" aria-label="Copiar IMEI">⧉</button><span id="mdImei" class="me-mono">—</span></span></span>
                            </div>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="mdResumen" class="mb-3"></div>

                        <ul class="nav nav-tabs" id="mdTabs" role="tablist">

                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#mdPanelDetalle"
                                    type="button">Perfil HLR (por secciones)</button>
                            </li>

                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mdPanelTecnico"
                                    type="button">Información técnica</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mdPanelJson"
                                    type="button">JSON original</button>
                            </li>
                        </ul>
                        <div class="tab-content pt-3">
                            <div class="tab-pane fade show active" id="mdPanelDetalle">
                                <div id="mdCategorias"></div>
                            </div>
                            <div class="tab-pane fade" id="mdPanelTecnico">
                                <div id="mdTecnico"></div>
                            </div>
                            <div class="tab-pane fade" id="mdPanelJson">
                                <pre class="json me-mono" id="mdJson"></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </template>

    <template id="panelClaro">

                <div class="lbl">Con bloqueos<small>filtrar ▸</small></div>

                <div class="n" id="kpiRevisar">0</div>
                <div class="lbl">Revisar respuesta<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi err kpi-click" data-fdim="estado" data-fval="FALLIDAS">
                <div class="n" id="kpiErrores">0</div>
                <div class="lbl">Errores / timeout<small>filtrar ▸</small></div>
            </div>
        </div>

        <div class="me-trabajo">

            <!-- ================= COLUMNA IZQUIERDA: pasos ================= -->
            <div class="me-trabajo-lateral">

                <!-- 1 · Conexión QDN -->
                <section data-me-paso="1" data-me-titulo="Conexión" data-me-abierto="nunca">
                    <div class="me-hint mb-2">QDN de <strong>Claro</strong> · producción (PDN)

                    <div class="fw-bold small mt-3 mb-1">Sesión del CM <span class="text-muted fw-normal">(solo para

                        <button type="button" class="me-ayuda" data-me-ayuda="Aprovisionar (crear o eliminar la línea en el HLR/HSS) solo se ofrece a usuarios autorizados con sesión del CM vigente: es la sesión la que dice quién eres. Son las mismas credenciales de las demás herramientas; si ya iniciaste sesión en otra pestaña, llegan solas." aria-label="Ayuda">?</button></div>

                            <input class="form-control form-control-sm me-mono" id="user" autocomplete="username">

                        <div class="col-6">
                            <label class="me-lbl" for="pass">Contraseña</label>

                        </div>
                        <div class="col-12">
                            <button class="btn btn-sm btn-me-ink" id="btnLogin" type="button">Iniciar sesión en el
                                CM</button>
                        </div>
                    </div>

                    <button class="btn btn-sm btn-link px-0" type="button" data-bs-toggle="collapse"

                        Ver / editar datos de conexión (avanzado)

                                <label class="me-lbl" for="cfgTokenUrl">Token URL</label>

                            </div>

                                <label class="form-check-label me-lbl d-flex align-items-center gap-2"

                                    <input type="checkbox" class="form-check-input" id="cfgAuthEnCuerpo" checked>
                                    Enviar client_id/secret en el cuerpo del token

                            title="Quitar el archivo cargado" aria-label="Quitar el archivo cargado">✕</button>
                    </div>

                    <div class="row g-2 mt-1">

                            <label class="me-lbl" for="selHoja">Hoja</label>
                            <select class="form-select form-select-sm me-mono" id="selHoja" disabled>
                                <option value="">— carga un archivo —</option>
                            </select>

                            <label class="me-lbl" for="selColumna">Columna de MSISDN</label>
                            <select class="form-select form-select-sm me-mono" id="selColumna" disabled>

                            </select>

    <!-- 1 · Shell común + sesión del CM (Keycloak): solo la usa la pestaña
         Claro para saber QUIÉN ejecuta y habilitar el aprovisionamiento a
         los usuarios autorizados -->
    <script src="../assets/base/catalogo.js"></script>
    <script src="../assets/base/me-ui.js"></script>
    <script src="../assets/base/me-api.js"></script>
    <script>
        MEUI.init({
            app: "hlr-hss",
            sesiones: ["qdn", "cm"],
            instrucciones: [
                "Esta herramienta junta en pestañas tres consultas: Tigo, Claro y Ambos («¿En qué HLR está?»). Cada pestaña tiene su propio motor.",
                "Tigo: consulta el HLR/HSS de Tigo por autogestión (X-Api-Key). Solo lectura. Ver doc/hlr-hss.",
                "Claro: consulta el QDN de Claro (OAuth2 propio) Y permite OPERAR sobre la línea -bloqueo, desbloqueo, conciliación, cambio de SIM/MSISDN-, con un resumen para confirmar antes de ejecutar. Escribe en producción. Ver doc/hlr-hss.",
                "Claro · Aprovisionamiento (crear o eliminar la línea en el HLR/HSS): solo lo ven usuarios autorizados con sesión del CM vigente. Se inicia sesión en el paso 1 o desde el chip CM de la cabecera.",
                "Ambos: consulta Claro y Tigo EN PARALELO por cada línea y concluye en cuál de las dos redes está. Solo lectura; el detalle forense completo de cada operador está en su propia pestaña. Ver doc/hlr-hss.",
                "Cambiar de pestaña reinicia esa consulta: no se guardan resultados de una pestaña mientras se está en otra.",
                "El resto de instrucciones (formato de MSISDN, concurrencia, filtros, exportación) es el mismo que ya conocías en cada herramienta — ábrelas desde el botón de ayuda una vez dentro de la pestaña."
            ]
        });
    </script>

    <!-- 2 · Los tres motores (cada uno en su propio IIFE; ver el encabezado
         de cada archivo). Cargan sin ejecutar nada visible todavía: cada
         uno espera a que su pestaña se monte de verdad. -->
    <script src="../assets/herramientas/hlr-hss/tigo.js"></script>
    <script src="../assets/herramientas/hlr-hss/claro.js"></script>
    <script src="../assets/herramientas/hlr-hss/ambos.js"></script>

    <!-- 3 · Interruptor de pestañas: monta/desmonta el <template> activo
         y llama a MotorX.iniciar() -->
    <script src="../assets/herramientas/hlr-hss/hlr-hss.js"></script>
