<!-- hlr_hss.html · v2.4
     ---------------------------------------------------------------------
     Este archivo es SOLO marcado + el interruptor de pestañas. Nada de
     reglas de negocio vive aquí:

       assets/me-ui.css / me-ui.js       marco visual, sesión, registro,
                                          tablas, importación y exportación
       assets/logica-hlr-hss-tigo.js     motor "Tigo"  = logica-qdn-tigo.js,
                                          envuelto en IIFE, SIN CAMBIOS DE LÓGICA
       assets/logica-hlr-hss-claro.js    motor "Claro" = logica-qdn.js +
                                          logica-qdn-operaciones.js, envueltos
                                          JUNTOS en un mismo IIFE, SIN CAMBIOS
                                          DE LÓGICA (incluye bloqueo/desbloqueo/
                                          conciliación — escriben en producción)
       assets/logica-hlr-hss-ambos.js    motor "Ambos" = logica-hlr-cruzado.js,
                                          envuelto en IIFE, SIN CAMBIOS DE LÓGICA
       assets/me-hlr-hss-puente.js       interruptor de pestañas: monta/
                                          desmonta el <template> de la pestaña
                                          activa y llama a MotorX.iniciar()

     Por qué un <template> por pestaña y no las tres montadas a la vez: los
     tres motores comparten (por diseño, ya desde antes de esta fusión) los
     mismos ids — #tablaResultados, #inputLineas, #btnConsultar,
     #modalDetalle, #logConexion... Tenerlos montados los tres a la vez
     duplicaría esos ids en el documento y solo el primero respondería. Por
     eso solo la pestaña activa vive en el DOM; cambiar de pestaña desmonta
     la anterior por completo antes de montar la siguiente.

     Reemplaza a validador_qdn.html, validador_qdn_tigo.html y
     validador_hlr_cruzado.html como TRES pestañas de una sola herramienta.
     Ver doc/hlr-hss/README.md.
     --------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Versionado: Major.Minor.Patch · fix/documentación incrementa Patch -->
    <title>HLR/HSS · Claro y Tigo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/me-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* ---------------------------------------------------------------
           Estilos de las TRES herramientas originales, tal cual (los
           nombres de clase e id ya eran idénticos entre las tres, así que
           no hace falta namespacing: son las mismas reglas repetidas 3
           veces en los archivos de origen, aquí solo una vez).
        --------------------------------------------------------------- */
        /* ---------------------------------------------------------------
           Estilos propios de ESTA herramienta.
           Todo lo estructural (shell, tablas, pasos, log) vive en me-ui.css.
        --------------------------------------------------------------- */

        .me-kpi.kpi-activo {
            box-shadow: inset 0 0 0 2px var(--me-negro);
        }

        /* --- Operaciones de escritura: se ven distintas del resto a
               propósito, para que no se confundan con una consulta. --- */
        .btn-operar {
            border: 1px solid #EAC4BF;
            background: #FBE2DF;
            color: var(--me-err);
            font-weight: 600;
        }

        .btn-operar:hover,
        .btn-operar:focus {
            background: var(--me-err);
            border-color: var(--me-err);
            color: #fff;
        }

        details.bloque-operaciones {
            border: 1px solid #EAC4BF;
            border-radius: .5rem;
            padding: .6rem .8rem;
            background: #FFF8F7;
        }

        details.bloque-operaciones>summary {
            cursor: pointer;
            font-weight: 700;
            font-size: .86rem;
            color: var(--me-err);
        }

        /* ---------- Menú de operaciones (modal de la línea) ----------
           Procesos y SIM arriba, como botones sueltos; Bloqueos al final,
           plegados, una fila por familia con su par bloquear | desbloquear. */
        .op-grupo { margin-bottom: .75rem; }

        .op-grupo-tit {
            font-weight: 700;
            font-size: .78rem;
            color: var(--me-suave);
            margin-bottom: .35rem;
        }

        details.op-bloqueos > summary {
            cursor: pointer;
            list-style: none;
        }

        details.op-bloqueos > summary::-webkit-details-marker { display: none; }

        details.op-bloqueos > summary::before {
            content: "▸";
            display: inline-block;
            width: 1em;
            transition: transform .15s;
        }

        details.op-bloqueos[open] > summary::before { transform: rotate(90deg); }

        .op-familias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: .4rem .9rem;
            margin-top: .35rem;
        }

        .op-familia {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            border: 1px solid var(--me-borde);
            border-radius: .4rem;
            padding: .35rem .5rem;
            background: #fff;
        }

        .op-familia-nom {
            font-size: .8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .op-familia-nom .bi { margin-right: .25rem; color: var(--me-suave); }

        .op-familia-par { display: flex; gap: .3rem; flex-shrink: 0; }

        .btn-operacion .bi { margin-right: .2rem; }

        /* Color por intención: bloquear/riesgo en rojo, desbloquear en verde,
           conciliar en ámbar; el icono ya dice de qué se trata. */
        .btn-operacion.op-bloqueo .bi,
        .btn-operacion.op-riesgo_alto .bi,
        .btn-operacion.op-provision .bi { color: var(--me-err); }

        .btn-operacion.op-desbloqueo .bi { color: var(--me-ok); }

        .btn-operacion.op-conciliacion .bi { color: var(--me-warn); }

        .op-menu-familia {
            padding: .35rem .75rem .1rem;
            font-size: .72rem;
            font-weight: 600;
            color: var(--me-suave);
        }

        .op-menu-familia .bi { margin-right: .25rem; }

        /* ---------- Tabla de confirmación de una operación ----------
           Reparto de ancho fijo (table-layout) en vez de automático: con
           el automático las columnas se peleaban el espacio y el valor
           actual terminaba encimado con el input de al lado. */
        .tabla-operacion-scroll {
            max-height: 340px;
            overflow: auto;
            border: 1px solid var(--me-borde);
            border-radius: .4rem;
        }

        .tabla-operacion {
            table-layout: fixed;
            width: 100%;
        }

        .tabla-operacion thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #F7F6F1;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .03em;
            white-space: nowrap;
        }

        .tabla-operacion thead th small {
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
            color: var(--me-suave);
        }

        .tabla-operacion td,
        .tabla-operacion th {
            vertical-align: top;
            padding: .4rem .5rem;
        }

        .tabla-operacion th.col-linea,
        .tabla-operacion td.col-linea {
            width: 8.5rem;
        }

        .tabla-operacion th.col-features,
        .tabla-operacion td.col-features {
            width: 11rem;
        }

        .tabla-operacion .linea-msisdn {
            font-weight: 600;
            font-size: .82rem;
        }

        /* El input ocupa el ancho de su celda y nada más: sin min-width no
           puede empujar a las columnas vecinas ni desbordar la tabla. */
        .tabla-operacion input.form-control {
            width: 100%;
            min-width: 0;
            font-size: .78rem;
        }

        .tabla-operacion .me-hint {
            font-size: .67rem;
            line-height: 1.25;
            margin-top: .15rem;
            overflow-wrap: anywhere;
        }

        .tabla-operacion .me-hint.hint-aviso {
            color: var(--me-warn);
        }

        /* "antes / después": dos renglones etiquetados y alineados, para que
           se lea de un vistazo de qué valor a qué valor va el cambio. */
        .tabla-operacion .cambio-fila {
            display: flex;
            align-items: baseline;
            gap: .4rem;
        }

        .tabla-operacion .cambio-fila+.cambio-fila {
            margin-top: .25rem;
        }

        .tabla-operacion .cambio-lbl {
            flex: 0 0 3.6rem;
            font-size: .6rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #9a9a94;
        }

        .tabla-operacion .cambio-lbl.nuevo {
            color: var(--me-ok);
            font-weight: 700;
        }

        .tabla-operacion .cambio-actual {
            font-size: .78rem;
            color: var(--me-suave);
            overflow-wrap: anywhere;
        }

        .tabla-operacion .cambio-campo {
            flex: 1 1 auto;
            min-width: 0;
        }

        /* Bloques plegables del modal de operación (líneas omitidas y
           "cuerpo que se envía"): cerrados por defecto para que el
           formulario se lea de corrido. */
        details.op-plegable>summary {
            cursor: pointer;
            font-weight: 700;
            font-size: .8rem;
        }

        .op-seccion-tit {
            font-weight: 700;
            font-size: .8rem;
            margin-bottom: .35rem;
        }

        .op-conteo {
            display: inline-block;
            background: #EBEAE4;
            border-radius: 999px;
            padding: 0 .45em;
            font-family: var(--me-mono);
            font-size: .72rem;
            font-weight: 600;
        }

        .badge-estado {
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .03em;
            border-radius: .35rem;
            padding: .3em .55em;
            white-space: nowrap;
        }

        .badge-estado.ok {
            background: #E2F2E8;
            color: var(--me-ok);
        }

        .badge-estado.off {
            background: #ECECEA;
            color: var(--me-off);
        }

        .badge-estado.warn {
            background: #FBEED8;
            color: var(--me-warn);
        }

        .badge-estado.info {
            background: #E2E9F2;
            color: var(--me-info);
        }

        .badge-estado.err {
            background: #FBE2DF;
            color: var(--me-err);
        }

        .badge-estado.neutro {
            background: #F0F0EC;
            color: var(--me-suave);
        }

        .chip-bloqueo {
            display: inline-flex;
            align-items: center;
            gap: .3em;
            font-size: .74rem;
            border: 1px solid var(--me-borde);
            border-radius: 999px;
            padding: .18em .6em;
            background: #fff;
            white-space: nowrap;
            color: var(--me-suave);
        }

        .chip-bloqueo.activo {
            border-color: #EAC4BF;
            background: #FBE2DF;
            color: var(--me-err);
            font-weight: 600;
        }

        td.col-accion {
            white-space: nowrap;
            text-align: center;
        }

        th.col-sel,
        td.col-sel {
            width: 1%;
            white-space: nowrap;
            text-align: center;
        }

        /* Aviso en la fila: la respuesta llegó, pero no es confiable tal cual */
        .aviso-fila {
            color: var(--me-warn);
            font-weight: 700;
            cursor: help;
        }

        .dropzone {
            border: 2px dashed var(--me-borde-2);
            border-radius: .5rem;
            background: #FCFBF8;
            padding: 1.1rem .8rem;
            text-align: center;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .dropzone:hover,
        .dropzone.drag {
            border-color: var(--me-negro);
            background: #FFFBE6;
        }

        .dropzone .icon {
            font-size: 1.4rem;
        }

        .dropzone p {
            margin: 0;
            font-size: .8rem;
            color: #5C5C57;
        }

        .file-info {
            font-family: var(--me-mono);
            font-size: .74rem;
        }

        .modal-header {
            background: var(--me-negro);
            color: #fff;
        }

        .modal-header .modal-title {
            font-weight: 800;
        }

        .modal-header .modal-title span {
            color: var(--me-amarillo);
        }

        pre.json {
            background: #141414;
            color: #E8E8E3;
            border-radius: .5rem;
            padding: 1rem;
            font-size: .73rem;
            max-height: 420px;
            overflow: auto;
        }

        .dl-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: .25rem .9rem;
            font-size: .82rem;
        }

        .dl-grid dt {
            color: var(--me-suave);
            font-weight: 500;
        }

        .dl-grid dd {
            font-family: var(--me-mono);
            margin: 0;
            word-break: break-all;
        }

        #barraFiltros .dropdown-menu {
            max-height: 280px;
            overflow: auto;
            min-width: 240px;
        }

        .form-check-input:checked {
            background-color: var(--me-negro);
            border-color: var(--me-negro);
        }

        #progresoWrap {
            display: none;
        }

        #mdCategorias {
            max-height: 60vh;
            overflow: auto;
        }

        /* ---------------------------------------------------------------
           Interruptor de pestañas: propio de esta página, no del sistema
           de diseño común (ninguna otra herramienta tiene varios motores
           montados/desmontados en un mismo documento).
        --------------------------------------------------------------- */
        .hlr-tabs {
            display: flex;
            gap: .4rem;
            padding: .6rem .6rem 0;
        }

        .hlr-tab {
            border: 1px solid var(--me-borde-2);
            border-bottom: none;
            border-radius: .5rem .5rem 0 0;
            background: #F0F0EC;
            color: var(--me-suave);
            font-weight: 700;
            font-size: .85rem;
            padding: .5rem 1.1rem;
            cursor: pointer;
        }

        .hlr-tab:hover {
            background: #FFFBE6;
            color: var(--me-negro);
        }

        .hlr-tab.activa {
            background: #fff;
            color: var(--me-negro);
            border-color: var(--me-borde-2);
            box-shadow: 0 -2px 0 var(--me-amarillo) inset;
        }

        .hlr-tab .bi {
            margin-right: .35rem;
        }

        #panelMontado {
            background: #fff;
            border-top: 1px solid var(--me-borde-2);
        }
    </style>
</head>

<body class="me-body">

    <div class="hlr-tabs" role="tablist" aria-label="Operador a consultar">
        <button type="button" class="hlr-tab activa" data-tab="tigo" role="tab" aria-selected="true">
            <i class="bi bi-reception-4"></i>Tigo
        </button>
        <button type="button" class="hlr-tab" data-tab="claro" role="tab" aria-selected="false">
            <i class="bi bi-reception-4"></i>Claro
        </button>
        <button type="button" class="hlr-tab" data-tab="ambos" role="tab" aria-selected="false">
            <i class="bi bi-search"></i>¿En qué HLR está? (ambos)
        </button>
    </div>

    <div id="panelMontado"></div>

    <!-- ============================================================
         Cada <template> es el marcado ORIGINAL de esa herramienta,
         íntegro (KPIs + pasos + tabla + modal). Un <template> no forma
         parte del DOM activo -no ejecuta scripts, no aplica ids-, así
         que los tres pueden convivir en el archivo sin chocar entre sí;
         el choque solo pasaría si más de uno estuviera CLONADO dentro
         de #panelMontado al mismo tiempo, y eso es justo lo que
         me-hlr-hss-puente.js evita.
         ============================================================ -->

    <template id="panelTigo">

        <!-- ============ RESUMEN (tarjetas = filtros rápidos) ============ -->
        <div class="me-kpis">
            <div class="me-kpi ok kpi-click" data-fdim="proceso" data-fval="ACTIVA">
                <div class="n" id="kpiActivas">0</div>
                <div class="lbl">Activas<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi neutro kpi-click" data-fdim="proceso" data-fval="SIN_PERFIL">
                <div class="n" id="kpiSinPerfil">0</div>
                <div class="lbl">Sin perfil<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi warn kpi-click" data-fdim="proceso" data-fval="RESIDUO_TIGO">
                <div class="n" id="kpiResiduoTigo">0</div>
                <div class="lbl">Residuo en Tigo<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi warn kpi-click" data-fdim="proceso" data-fval="INCONSISTENTE">
                <div class="n" id="kpiRevisar">0</div>
                <div class="lbl">Revisar respuesta<small>filtrar ▸</small></div>
            </div>
            <div class="me-kpi err kpi-click" data-fdim="proceso" data-fval="FALLIDAS">
                <div class="n" id="kpiErrores">0</div>
                <div class="lbl">Errores / timeout<small>filtrar ▸</small></div>
            </div>
        </div>

        <div class="me-trabajo">

            <!-- ================= COLUMNA IZQUIERDA: pasos ================= -->
            <div class="me-trabajo-lateral">

                <!-- 1 · Conexión -->
                <section data-me-paso="1" data-me-titulo="Conexión" data-me-abierto="nunca">
                    <div class="me-hint mb-2">Consulta el HLR/HSS de <strong>Tigo</strong>. No requiere OAuth: se
                        autentica con una llave fija (<code>X-Api-Key</code>). El gateway se llama
                        <code>tulioqa</code>, pero <strong>los datos son de producción</strong>: hay un solo
                        HLR/HSS, no existe uno de pruebas.
                    </div>
                    <button class="btn btn-sm btn-link px-0" type="button" data-bs-toggle="collapse"
                        data-bs-target="#tigoAvanzado" aria-expanded="false" aria-controls="tigoAvanzado">
                        Ver / editar datos de conexión (avanzado)
                    </button>
                    <div class="collapse" id="tigoAvanzado">
                        <div class="row g-2 mt-1">
                            <div class="col-12">
                                <label class="me-lbl" for="cfgBaseUrl">URL del servicio</label>
                                <input type="text" id="cfgBaseUrl" class="form-control form-control-sm me-mono">
                            </div>
                            <div class="col-12">
                                <label class="me-lbl" for="cfgApiKey">X-Api-Key</label>
                                <input type="password" id="cfgApiKey" class="form-control form-control-sm me-mono">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 2 · Líneas a consultar -->
                <section data-me-paso="2" data-me-titulo="Líneas a consultar" data-me-abierto="siempre">
                    <div class="dropzone" id="dropzone" tabindex="0" role="button"
                        aria-label="Cargar archivo Excel o CSV">
                        <div class="icon"><i class="bi bi-file-earmark-spreadsheet"></i></div>
                        <p><strong>Arrastra el Excel (.xlsx) o CSV</strong><br>o haz clic para elegirlo.</p>
                        <input type="file" id="inputArchivo" accept=".xlsx,.xls,.csv" hidden>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <div class="file-info text-muted flex-grow-1" id="fileInfo"></div>
                        <button class="btn btn-sm btn-outline-danger d-none" id="btnQuitarArchivo"
                            title="Quitar el archivo cargado">✕</button>
                    </div>

                    <div class="row g-2 mt-1">
                        <div class="col-6">
                            <label class="me-lbl" for="selHoja">Hoja</label>
                            <select class="form-select form-select-sm me-mono" id="selHoja" disabled>
                                <option value="">— carga un archivo —</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="me-lbl" for="selColumna">Columna de MSISDN</label>
                            <select class="form-select form-select-sm me-mono" id="selColumna" disabled>
                                <option value="">— carga un archivo —</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="me-lbl" for="inputLineas">O escribe los MSISDN</label>
                            <textarea id="inputLineas" class="form-control form-control-sm me-mono" rows="1"
                                placeholder="3057888636  3054325342 ..."></textarea>
                            <div class="me-hint">Acepta espacios, tabulaciones, saltos de línea, coma o punto y coma. No
                                hace falta anteponer el 57: se agrega automáticamente.</div>
                        </div>
                        <div class="col-5">
                            <label class="me-lbl" for="cfgConcurrencia">Concurrencia</label>
                            <input type="number" id="cfgConcurrencia" class="form-control form-control-sm me-mono"
                                value="8" min="1" max="15">
                        </div>
                        <div class="col-7 d-flex align-items-end">
                            <button class="btn btn-me w-100" id="btnConsultar">Consultar</button>
                        </div>
                    </div>

                    <div id="progresoWrap" class="mt-3">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="me-mono" id="progresoTexto">Consultando…</small>
                            <small class="me-mono" id="progresoPct">0%</small>
                        </div>
                        <div class="progress" style="height:8px">
                            <div class="progress-bar bg-dark" id="progresoBar" style="width:0%"></div>
                        </div>
                    </div>
                </section>

                <!-- 3 · Registro -->
                <section data-me-paso="3" data-me-titulo="Registro de la consulta" data-me-abierto="nunca">
                    <div id="logConexion" data-me-log></div>
                    <div class="d-flex gap-2 mt-2">
                        <button class="btn btn-sm btn-me-line" id="btnLimpiarLog" type="button">Limpiar</button>
                        <button class="btn btn-sm btn-me-line" id="btnCopiarLog" type="button">Copiar</button>
                    </div>
                </section>
            </div>

            <!-- ================= COLUMNA DERECHA: filtros + tabla ================= -->
            <div class="me-trabajo-datos">

                <div class="me-filtros" id="barraFiltros" hidden>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-me-line dropdown-toggle" data-bs-toggle="dropdown"
                            data-bs-auto-close="outside" id="btnFEstado">Estado</button>
                        <ul class="dropdown-menu p-2" id="fEstado"></ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-me-line dropdown-toggle" data-bs-toggle="dropdown"
                            data-bs-auto-close="outside" id="btnFBloqueo">Restricciones</button>

                        aria-label="Cargar archivo Excel o CSV">

                        <p><strong>Arrastra el Excel (.xlsx) o CSV</strong><br>o haz clic para elegirlo.</p>

                    <div class="d-flex align-items-center gap-2 mt-2">

                    </div>

                    <div class="row g-2 mt-1">
                        <div class="col-6">
                            <label class="me-lbl" for="selHoja">Hoja</label>
                            <select class="form-select form-select-sm me-mono" id="selHoja" disabled>
                                <option value="">— carga un archivo —</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="me-lbl" for="selColumna">Columna de MSISDN</label>

                                <option value="">— carga un archivo —</option>
                            </select>
                        </div>
                        <div class="col-12">

                            </div>
                        </div>
                        <div class="col-5">
                            <label class="me-lbl" for="cfgConcurrencia">Líneas en paralelo</label>
                            <input type="number" id="cfgConcurrencia" class="form-control form-control-sm me-mono"

                        </div>
                        <div class="col-7 d-flex align-items-end">
                            <button class="btn btn-me w-100" id="btnConsultar">Consultar</button>
                        </div>
                    </div>

                    <div id="progresoWrap" class="mt-3">
                        <div class="d-flex justify-content-between mb-1">

                            <small class="me-mono" id="progresoPct">0%</small>
                        </div>
                        <div class="progress" style="height:8px">
                            <div class="progress-bar bg-dark" id="progresoBar" style="width:0%"></div>
                        </div>
                    </div>
                </section>

                <section data-me-paso="2" data-me-titulo="Registro de la consulta" data-me-abierto="nunca">

                    <div class="d-flex gap-2 mt-2">
                        <button class="btn btn-sm btn-me-line" id="btnLimpiarLog" type="button">Limpiar</button>
                        <button class="btn btn-sm btn-me-line" id="btnCopiarLog" type="button">Copiar</button>
                    </div>
                </section>
            </div>

            <!-- ================= COLUMNA DERECHA: filtros + tabla ================= -->
            <div class="me-trabajo-datos">

                <div class="me-filtros" id="barraFiltros" hidden>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-me-line dropdown-toggle" data-bs-toggle="dropdown"

                    </div>
                    <button class="btn btn-sm btn-me-line" id="btnLimpiarFiltros">Limpiar filtros <i
                            class="bi bi-x-circle"></i></button>

                    <div class="me-filtros-der">
                        <select class="form-select form-select-sm" data-me-sep style="width:auto"></select>
                        <button class="btn btn-sm btn-me-line" id="btnCSV"><i class="bi bi-filetype-csv"></i>
                            CSV</button>
                        <button class="btn btn-sm btn-me-line" id="btnXLSX"><i class="bi bi-file-earmark-excel"></i>
                            Excel</button>
                        <button class="btn btn-sm btn-me-line" id="btnJSON"><i class="bi bi-filetype-json"></i>
                            JSON</button>
                    </div>
                </div>

                <div class="me-tabla-panel">
                    <table id="tablaResultados" class="table table-striped table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>MSISDN</th>
                                <th>Ubicación</th>
                                <th>Claro</th>
                                <th>Tigo</th>
                                <th>RETCODE Tigo</th>
                                <th>Detalle</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div class="me-hint p-2" id="msgVacio">
                        Escribe uno o varios MSISDN (o carga un Excel/CSV) y presiona <strong>Consultar</strong>.
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <div>
                            <h5 class="modal-title mb-0">Línea <span id="mdMsisdn" class="me-mono"></span>
                                <button type="button" class="btn-copy" data-copy-target="mdMsisdn"
                                    title="Copiar línea">⧉</button>
                            </h5>
                            <div class="mt-1" style="font-size:.8rem;opacity:.85">
                                IMSI <span id="mdImsi" class="me-mono">—</span>
                                <button type="button" class="btn-copy" data-copy-target="mdImsi"
                                    title="Copiar IMSI">⧉</button>
                            </div>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="mdResumen" class="mb-3"></div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <h6 class="fw-bold">Claro (QDN)</h6>
                                <div id="mdClaroResumen"></div>
                                <details class="mt-2">
                                    <summary class="me-hint" style="cursor:pointer">Ver JSON crudo</summary>
                                    <pre class="json me-mono mt-2" id="mdClaroJson"></pre>
                                </details>
                            </div>
                            <div class="col-md-6">
                                <h6 class="fw-bold">Tigo (HLR)</h6>

                                </details>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
