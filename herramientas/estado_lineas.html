<!-- estado_lineas.html · v1.2.0
     ---------------------------------------------------------------------
     Este archivo es SOLO marcado. Nada de lógica ni estilos viven aquí:

       assets/base/me-ui.css / me-ui.js          marco visual, sesión, registro,
                                            tablas y exportación
       assets/base/me-api.js                     Keycloak, auth y llamadas al CM
       assets/compartido/cm-lineas.js                  resolver la línea, órdenes del CM
                                            y tabla con casillas (compartido)
       assets/herramientas/estado-lineas/       estado-lineas.js (reglas e interfaz)
                                                y estado-lineas.css (estilos)

     Bloquea o inactiva líneas en el CM, en masivo. ESCRIBE EN PRODUCCIÓN.
     Ver doc/estado-lineas/README.md.
     --------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Versionado: Major.Minor.Patch · fix/documentación incrementa Patch -->
    <title>Bloquear/Inactivar líneas</title>

    <!-- Librerías de CDN: versiones y URLs en assets/base/dependencias.js (Bootstrap, iconos y fuentes siempre) -->
    <script src="../assets/base/dependencias.js" data-me-deps="datatables xlsx"></script>
    <link rel="stylesheet" href="../assets/base/me-ui.css">
    <link rel="stylesheet" href="../assets/herramientas/estado-lineas/estado-lineas.css">
</head>

<body class="me-body" data-me-herramienta="estado-lineas">

    <!-- ============ RESUMEN ============ -->
    <div class="me-kpis">
        <div class="me-kpi neutro" style="cursor:default">
            <div class="n" id="kTotal">0</div>
            <div class="lbl">Líneas</div>
        </div>
        <div class="me-kpi info" style="cursor:default">
            <div class="n" id="kSel">0</div>
            <div class="lbl">Marcadas</div>
        </div>
        <div class="me-kpi ok" style="cursor:default">
            <div class="n" id="kOk">0</div>
            <div class="lbl">Cambiadas</div>
        </div>
        <div class="me-kpi err" style="cursor:default">
            <div class="n" id="kErr">0</div>
            <div class="lbl">Con error</div>
        </div>
    </div>

    <div class="me-trabajo">

        <!-- ================= COLUMNA IZQUIERDA: pasos ================= -->
        <div class="me-trabajo-lateral">

            <!-- 1 · Conexión -->
            <section data-me-paso="1" data-me-titulo="Conexión con el CM" data-me-abierto="sin-sesion">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="me-lbl" for="user">Usuario</label>
                        <input class="form-control form-control-sm me-mono" id="user" autocomplete="username">
                    </div>
                    <div class="col-6">
                        <label class="me-lbl" for="pass">Contraseña</label>
                        <input class="form-control form-control-sm me-mono" id="pass" type="password"
                            autocomplete="current-password">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-sm btn-me-ink" id="btnLogin" type="button">Iniciar sesión</button>
                    </div>
                    <button type="button" class="me-ayuda" data-me-ayuda="Son las mismas credenciales del CM que usan las demás herramientas. Con la sesión vigente se puede cambiar el estado." aria-label="Ayuda">?</button>
                </div>
            </section>

            <!-- 2 · Líneas -->
            <section data-me-paso="2" data-me-titulo="Líneas" data-me-abierto="siempre">
                <label class="me-lbl" for="inputLineas">Líneas (máximo 200)</label>
                <textarea id="inputLineas" class="form-control form-control-sm me-mono" rows="5"
                    placeholder="3332463395&#10;3332463394"></textarea>
                <div class="me-hint" id="infoLineas">0 líneas cargadas.</div>
                <button class="btn btn-sm btn-me mt-2 w-100" id="btnConsultar" type="button">Consultar líneas</button>
            </section>

            <!-- 3 · Cambio de estado -->
            <section data-me-paso="3" data-me-titulo="Cambio de estado" data-me-abierto="con-sesion">
                <div id="accionBloqueada" class="alert alert-warning py-2 mb-2" hidden></div>
                <div id="accionCampos">
                    <p class="small text-danger">Escribe en producción.</p>
                    <label class="me-lbl" for="selDestino">Nuevo estado</label>
                    <select id="selDestino" class="form-select form-select-sm">
                        <option value="bloquear">Bloquear</option>
                        <option value="inactivar">Inactivar</option>
                    </select>

                    <div class="alert alert-warning py-2 mt-2 mb-0 small aviso-held" id="avisoHeld" hidden>Al inactivar, la IMSI queda en HELD; su liberación en el BSS es manual.</div>

                    <label class="me-lbl mt-2" for="inputRazon">Razón</label>
                    <input id="inputRazon" class="form-control form-control-sm" value="Exito Razón bloqueo">
                    <button type="button" class="me-ayuda" data-me-ayuda="Va en REASON. Se precarga con la que usa la interfaz del CM para ese estado; se puede cambiar." aria-label="Ayuda">?</button>

                    <label class="me-lbl mt-2" for="inputNota">Nota (opcional)</label>
                    <textarea id="inputNota" class="form-control form-control-sm" rows="2"
                        placeholder="Motivo del cambio"></textarea>
                    <div class="me-hint">Nota: <span id="vistaNota">—</span></div>

                    <div class="me-hint mt-2" id="resumenAccion">Marca en la tabla las líneas a cambiar.</div>

                </div>
            </section>

            <!-- 4 · Registro -->
            <section data-me-paso="4" data-me-titulo="Registro de la operación" data-me-abierto="nunca">
                <div id="logConexion" data-me-log></div>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-sm btn-me-line" id="btnLimpiarLog" type="button">Limpiar</button>
                    <button class="btn btn-sm btn-me-line" id="btnCopiarLog" type="button">Copiar</button>
                    <button class="btn btn-sm btn-me-line" id="btnBitacora" type="button">Bitácora</button>
                </div>
            </section>
        </div>

        <!-- ================= COLUMNA DERECHA: tabla ================= -->
        <div class="me-trabajo-datos">
            <div class="me-barras">
                <div class="me-filtros">
                    <div id="fEstado"></div>
                    <div id="fProceso"></div>
                    <div id="fSel"></div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="chkVerOcultas">
                        <label class="form-check-label small" for="chkVerOcultas">Ver ocultas (<span id="numOcultas">0</span>)</label>
                    </div>
                    <button class="btn btn-sm btn-me-line" id="btnLimpiarFiltros" type="button">Limpiar filtros</button>
                    <div id="fColumnas"></div>
                    <div class="me-filtros-der">
                        <label class="visually-hidden" for="separadorCSV">Separador CSV</label>
                        <select id="separadorCSV" class="form-select form-select-sm" data-me-sep style="width:auto"></select>
                        <button id="btnCSV" class="btn btn-sm btn-me-line" type="button">CSV</button>
                        <button id="btnXLSX" class="btn btn-sm btn-me-line" type="button">Excel</button>
                        <button id="btnJSON" class="btn btn-sm btn-me-line" type="button">JSON</button>
                    </div>
                </div>
                <div class="me-filtros barra-lote">
                    <button class="btn btn-sm btn-me-line" id="btnMarcarTodo" type="button">Marcar todo</button>
                    <button class="btn btn-sm btn-me-line" id="btnDesmarcarTodo" type="button">Desmarcar todo</button>
                    <button class="btn btn-sm btn-me-line" id="btnMarcarVisibles" type="button">Marcar visibles</button>
                    <button class="btn btn-sm btn-me-line" id="btnDesmarcarVisibles" type="button">Desmarcar visibles</button>
                    <button class="btn btn-sm btn-me-line" id="btnRestaurarOcultas" type="button">Mostrar todas</button>
                    <span class="me-hint ms-auto" id="resumenSeleccion"></span>
                </div>
                <div class="me-lote" id="barraLote" hidden>
                    <span data-me-lote-n></span>
                    <button class="btn btn-sm btn-me-line" id="btnOcultarSel" type="button">Ocultar marcadas</button>
                    <button class="btn btn-sm btn-me-line" id="btnOcultarNoSel" type="button">Ocultar no marcadas</button>
                    <div class="me-acciones-escritura"><button class="btn btn-sm btn-me-peligro mt-1" id="btnEjecutar" type="button" disabled>Aplicar
                            a las marcadas</button></div>
                </div>
            </div>

            <div class="me-tabla-panel">
                <table id="tablaLineas" class="table table-sm table-hover table-striped w-100"
                    style="display:none"></table>
                <div class="me-hint p-2" id="msgVacio">Carga las líneas y consulta para comenzar.</div>
            </div>
        </div>
    </div>

    <!-- 1 · Shell común -->
    <script src="../assets/base/catalogo.js"></script>
    <script src="../assets/base/me-ui.js"></script>
    <script>
        MEUI.init({
            app: "estado-lineas",
            sesiones: ["cm"],
            instrucciones: [
                "1 · Conexión: la sesión del CM consulta las líneas y dice quién eres. Sin sesión solo se puede consultar.",
                "2 · Pega las líneas (máximo 200) y presiona «Consultar líneas»: trae su cuenta, estado, IMSI y el estado de la IMSI en el inventario.",
                "Marca en la tabla las líneas a cambiar. Como en el cierre de casos: filtros, marcar/desmarcar lo visible y ocultar/mostrar filas.",
                "3 · Elige Bloquear o Inactivar, revisa la razón y aplica. ESCRIBE EN PRODUCCIÓN: antes de enviar se muestra un resumen para confirmar.",
                "Al INACTIVAR, la IMSI pasa a HELD y hay que liberarla a mano en el BSS para volver a usarla.",
                "Después de cada orden la línea se vuelve a consultar: la columna Estado muestra lo que el CM tiene de verdad."
            ]
        });
    </script>

    <!-- 2 · Acceso al CM -->
    <script src="../assets/base/me-api.js"></script>

    <!-- 3 · Operaciones sobre líneas, compartidas con «Cambio IMSI y línea Claro|Tigo» -->
    <script src="../assets/compartido/cm-lineas.js"></script>

    <!-- 4 · Esta herramienta: reglas e interfaz -->
    <script src="../assets/herramientas/estado-lineas/estado-lineas.js"></script>
</body>

</html>
