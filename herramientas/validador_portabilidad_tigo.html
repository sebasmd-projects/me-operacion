<!-- validador_portabilidad_tigo.html · v1.6
     ---------------------------------------------------------------------
     Este archivo es SOLO marcado. Nada de lógica ni estilos viven aquí:

       assets/base/me-ui.css / me-ui.js              marco visual, sesión, registro,
                                                 tablas, importación y exportación
       assets/base/me-api.js                         acceso al CM (Keycloak + consultas),
                                                 para el estado ME de cada línea
       assets/herramientas/portabilidad-tigo/
           portabilidad-tigo.js    reglas de negocio (auth por X-Api-Key, parseo
                                   del perfil HLR, concurrencia, reintentos) e
                                   interfaz (enganche con el shell)
           portabilidad-tigo.css   estilos propios

     Reemplaza a CheckPortabilidad.html: valida por MSISDN si la línea quedó
     CREADA en el HLR de Tigo tras un proceso de portabilidad, con
     concurrencia real, reintentos por timeout y detalle completo del
     perfil HLR devuelto.

     v1.3: con sesión del CM (opcional), cada línea trae también su estado
     en Optiva (Activa/Desactivada/Disponible/Bloqueada/No está en el CM),
     para cruzarlo con el RETCODE de Tigo sin salir de la herramienta.
     --------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Versionado: Major.Minor.Patch · fix/documentación incrementa Patch -->
    <title>Validador Portabilidad · HLR Tigo</title>

    <!-- Librerías de CDN: versiones y URLs en assets/base/dependencias.js (Bootstrap, iconos y fuentes siempre) -->
    <script src="../assets/base/dependencias.js" data-me-deps="datatables xlsx"></script>
    <link rel="stylesheet" href="../assets/base/me-ui.css">
    <link rel="stylesheet" href="../assets/herramientas/portabilidad-tigo/portabilidad-tigo.css">
</head>

<body class="me-body" data-me-herramienta="portabilidad-tigo">

    <!-- ============ RESUMEN (tarjetas = filtros rápidos) ============ -->
    <div class="me-kpis">
        <div class="me-kpi ok kpi-click" data-fdim="proceso" data-fval="CREADA">
            <div class="n" id="kpiCreadas">0</div>
            <div class="lbl">Creadas<small>filtrar ▸</small></div>
        </div>
        <div class="me-kpi neutro kpi-click" data-fdim="proceso" data-fval="SIN_PERFIL">
            <div class="n" id="kpiSinPerfil">0</div>
            <div class="lbl">Sin perfil (pendiente)<small>filtrar ▸</small></div>
        </div>
        <div class="me-kpi warn kpi-click" data-fdim="proceso" data-fval="RESIDUO_TIGO">
            <div class="n" id="kpiResiduoTigo">0</div>
            <div class="lbl">Residuo en Tigo<small>filtrar ▸</small></div>
        </div>
        <div class="me-kpi warn kpi-click" data-fdim="proceso" data-fval="INCONSISTENTE">
            <div class="n" id="kpiRevisar">0</div>
            <div class="lbl">Revisar respuesta<small>filtrar ▸</small></div>
        </div>
        <div class="me-kpi err kpi-click" data-fdim="proceso" data-fval="FALLIDAS">
            <div class="n" id="kpiErrores">0</div>
            <div class="lbl">Errores / timeout<small>filtrar ▸</small></div>
        </div>
    </div>

    <div class="me-trabajo">

        <!-- ================= COLUMNA IZQUIERDA: pasos ================= -->
        <div class="me-trabajo-lateral">

            <!-- 1 · Conexión -->
            <section data-me-paso="1" data-me-titulo="Conexión" data-me-abierto="nunca">
                <button type="button" class="me-ayuda" data-me-ayuda="Consulta el HLR/HSS de Tigo. No requiere OAuth: se autentica con una llave fija (X-Api-Key). El gateway se llama tulioqa, pero los datos son de producción: hay un solo HLR/HSS, no existe uno de pruebas." aria-label="Ayuda">?</button>
                <button class="btn btn-sm btn-link px-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#tigoAvanzado" aria-expanded="false" aria-controls="tigoAvanzado">
                    Ver / editar datos de conexión (avanzado)
                </button>
                <div class="collapse" id="tigoAvanzado">
                    <div class="row g-2 mt-1">
                        <div class="col-12">
                            <label class="me-lbl" for="cfgBaseUrl">URL del servicio</label>
                            <input type="text" id="cfgBaseUrl" class="form-control form-control-sm me-mono">
                        </div>
                        <div class="col-12">
                            <label class="me-lbl" for="cfgApiKey">X-Api-Key</label>
                            <input type="password" id="cfgApiKey" class="form-control form-control-sm me-mono">
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2 · Sesión del CM (opcional) -->
            <section data-me-paso="2" data-me-titulo="Sesión del CM (opcional)" data-me-abierto="nunca">
                <button type="button" class="me-ayuda" data-me-ayuda="Con sesión, cada línea trae también su estado en el CM (Optiva) —Activa, Desactivada, Disponible o Bloqueada— para cruzarlo con el RETCODE de Tigo (ver la regla del 3001 en la documentación). Sin sesión, la herramienta sigue funcionando igual, esa columna solo queda vacía." aria-label="Ayuda">?</button>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="me-lbl" for="user">Usuario</label>
                        <input class="form-control form-control-sm me-mono" id="user" autocomplete="username">
                    </div>
                    <div class="col-6">
                        <label class="me-lbl" for="pass">Contraseña</label>
                        <input class="form-control form-control-sm me-mono" id="pass" type="password"
                            autocomplete="current-password">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-sm btn-me-ink" id="btnLogin" type="button">Iniciar sesión</button>
                    </div>
                    <button type="button" class="me-ayuda" data-me-ayuda="Son las mismas credenciales del CM que usan las demás herramientas: si ya iniciaste sesión en otra pestaña, llegan solas." aria-label="Ayuda">?</button>
                </div>
            </section>

            <!-- 3 · Líneas a consultar -->
            <section data-me-paso="3" data-me-titulo="Líneas a consultar" data-me-abierto="siempre">
                <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Cargar archivo Excel o CSV">
                    <div class="icon"><i class="bi bi-file-earmark-spreadsheet"></i></div>
                    <p><strong>Arrastra el Excel (.xlsx) o CSV</strong><br>o haz clic para elegirlo.</p>
                    <label for="inputArchivo" class="visually-hidden">Archivo de líneas</label>
                    <input type="file" id="inputArchivo" accept=".xlsx,.xls,.csv" hidden>
                </div>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <div class="file-info text-muted flex-grow-1" id="fileInfo"></div>
                    <button class="btn btn-sm btn-outline-danger d-none" id="btnQuitarArchivo"
                        title="Quitar el archivo cargado" aria-label="Quitar el archivo cargado">✕</button>
                </div>

                <div class="row g-2 mt-1">
                    <div class="col-6">
                        <label class="me-lbl" for="selHoja">Hoja</label>
                        <select class="form-select form-select-sm me-mono" id="selHoja" disabled>
                            <option value="">— carga un archivo —</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="me-lbl" for="selColumna">Columna de MSISDN</label>
                        <select class="form-select form-select-sm me-mono" id="selColumna" disabled>
                            <option value="">— carga un archivo —</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="me-lbl" for="inputLineas">O escribe los MSISDN</label>
                        <textarea id="inputLineas" class="form-control form-control-sm me-mono" rows="1"
                            placeholder="3057888636  3054325342 ..."></textarea>
                        <button type="button" class="me-ayuda" data-me-ayuda="Acepta espacios, tabulaciones, saltos de línea, coma o punto y coma. No hace falta anteponer el 57: se agrega automáticamente." aria-label="Ayuda">?</button>
                    </div>
                    <div class="col-5">
                        <label class="me-lbl" for="cfgConcurrencia">Concurrencia</label>
                        <input type="number" id="cfgConcurrencia" class="form-control form-control-sm me-mono"
                            value="8" min="1" max="15">
                    </div>
                    <div class="col-7 d-flex align-items-end">
                        <button class="btn btn-me w-100" id="btnConsultar">Consultar</button>
                    </div>
                </div>


            </section>

            <!-- 4 · Registro -->
            <section data-me-paso="4" data-me-titulo="Registro de la consulta" data-me-abierto="nunca">
                <div id="logConexion" data-me-log></div>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-sm btn-me-line" id="btnLimpiarLog" type="button">Limpiar</button>
                    <button class="btn btn-sm btn-me-line" id="btnCopiarLog" type="button">Copiar</button>
                </div>
            </section>
        </div>

        <!-- ================= COLUMNA DERECHA: filtros + tabla ================= -->
        <div class="me-trabajo-datos">

            <div class="me-barras">
                <div class="me-filtros" id="barraFiltros">
                    <div id="fEstado"></div>
                    <div id="fBloqueo"></div>
                    <button class="btn btn-sm btn-me-line" id="btnLimpiarFiltros">Limpiar filtros <i
                            class="bi bi-x-circle"></i></button>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-me-line dropdown-toggle" data-bs-toggle="dropdown"
                            data-bs-auto-close="outside"><i class="bi bi-layout-three-columns"></i> Columnas</button>
                        <ul class="dropdown-menu dropdown-menu-end p-2" id="menuColumnas"></ul>
                    </div>

                    <div class="me-filtros-der">
                        <label class="visually-hidden" for="separadorCSV">Separador CSV</label>
                        <select id="separadorCSV" class="form-select form-select-sm" data-me-sep style="width:auto"></select>
                        <button class="btn btn-sm btn-me-line" id="btnCSV"><i class="bi bi-filetype-csv"></i> CSV</button>
                        <button class="btn btn-sm btn-me-line" id="btnXLSX"><i class="bi bi-file-earmark-excel"></i>
                            Excel</button>
                        <button class="btn btn-sm btn-me-line" id="btnJSON"><i class="bi bi-filetype-json"></i>
                            JSON</button>
                    </div>
                </div>
            </div>

            <div class="me-tabla-panel">
                <table id="tablaResultados" class="table table-striped table-hover align-middle w-100">
                        <thead></thead>
                    <tbody></tbody>
                </table>
                <div class="me-hint p-2" id="msgVacio">Escribe líneas o carga un archivo para consultar.</div>
            </div>
        </div>
    </div>

    <!-- ============ MODAL DETALLE ============ -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title mb-0">Línea <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdMsisdn"
                                title="Copiar línea" aria-label="Copiar línea">⧉</button><span id="mdMsisdn" class="me-mono"></span></span>
                        </h5>
                        <div class="mt-1" style="font-size:.8rem;opacity:.85">
                            IMSI <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdImsi"
                                title="Copiar IMSI" aria-label="Copiar IMSI">⧉</button><span id="mdImsi" class="me-mono">—</span></span>
                            <span class="ms-3">IMEI <span class="me-copiable"><button type="button" class="btn-copy" data-copy-target="mdImei"
                                title="Copiar IMEI" aria-label="Copiar IMEI">⧉</button><span id="mdImei" class="me-mono">—</span></span></span>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="mdResumen" class="mb-3"></div>

                    <ul class="nav nav-tabs" id="mdTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#mdPanelDetalle"
                                type="button">Perfil HLR (por secciones)</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mdPanelTecnico"
                                type="button">Información técnica</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mdPanelJson"
                                type="button">JSON original</button>
                        </li>
                    </ul>
                    <div class="tab-content pt-3">
                        <div class="tab-pane fade show active" id="mdPanelDetalle">
                            <div id="mdCategorias"></div>
                        </div>
                        <div class="tab-pane fade" id="mdPanelTecnico">
                            <div id="mdTecnico"></div>
                        </div>
                        <div class="tab-pane fade" id="mdPanelJson">
                            <pre class="json me-mono" id="mdJson"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 1 · Shell común -->
    <script src="../assets/base/catalogo.js"></script>
    <script src="../assets/base/me-ui.js"></script>
    <script>
        MEUI.init({
            app: "portabilidad-tigo",
            sesiones: ["cm"],
            instrucciones: [
                "1 · Conexión: la llave y la URL ya vienen listas; solo ábrelo si necesitas cambiarlas. Aunque el gateway se llame «qa», la consulta llega al HLR/HSS de producción: los datos son reales.",
                "2 · Sesión del CM (opcional): si inicias sesión, cada línea trae también su estado en Optiva (Activa/Desactivada/Disponible/Bloqueada) — es el dato que hace falta para la regla del RETCODE 3001. Sin sesión, la herramienta funciona igual, solo que esa columna queda vacía.",
                "3 · Líneas: escribe uno o varios MSISDN (sin el 57, se agrega solo) o carga un Excel/CSV, y presiona Consultar.",
                "4 · Las consultas corren en paralelo (por defecto 8 a la vez) con hasta 2 reintentos automáticos por timeout.",
                "5 · Revisa la tabla: usa las tarjetas y los filtros para acotar, haz clic en una fila o en el ícono 👁 para ver el perfil HLR completo por secciones y el JSON original.",
                "6 · Exporta con CSV / Excel / JSON lo que quede a la vista.",
                "Nota: la interpretación de bloqueos/restricciones es heurística (formato de HLR sin documentación pública); el detalle crudo siempre queda disponible para confirmar.",
                "El proceso avanza en cadena: 1033 «Residuo en Tigo» → (Tigo depura su HLR/HSS) → 3001 «Sin perfil» → (se crea el perfil) → 0 «Creada».",
                "RETCODE 3001 no prueba que el número sea de Móvil Éxito: si en ME (Optiva) la línea figura ACTIVA se consulta Claro; si sigue activa allí, la portabilidad no se completó; si Claro no la reporta activa, se escala a Optiva; si está inactiva, no tener perfil es lo esperado; también puede ser un número ajeno a ME (posible Port Out).",
                "RETCODE 1033: la línea se portó a Móvil Éxito pero Tigo no la eliminó de su HLR/HSS. Ese residuo bloquea la creación — se escala a Tigo."
            ]
        });
    </script>

    <!-- 2 · Acceso al CM (estado ME de cada línea, opcional) -->
    <script src="../assets/base/me-api.js"></script>

    <script src="../assets/compartido/hlr-consulta.js"></script>

    <!-- 3 · Esta herramienta: reglas de negocio e interfaz -->
    <script src="../assets/herramientas/portabilidad-tigo/portabilidad-tigo.js"></script>
</body>

</html>
